<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trapping Rain Water Stack Visualizer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #181825;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #f5c2e7; }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }
        button {
            background: #89b4fa;
            color: #11111b;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.9; }
        
        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        /* Graph Visuals */
        .chart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #313244;
            padding: 20px;
            border-radius: 8px;
            position: relative;
        }
        .chart {
            display: flex;
            align-items: flex-end;
            height: 160px;
            gap: 8px;
            border-bottom: 2px solid #585b70;
            padding-bottom: 4px;
            position: relative;
        }
        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45px;
            position: relative;
        }
        .bar {
            width: 100%;
            background: #a6adc8;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            transition: background-color 0.3s;
            position: relative;
            z-index: 2;
        }
        .water-layer {
            position: absolute;
            left: 0;
            width: 100%;
            background: rgba(137, 180, 250, 0.6);
            border: 1px dashed #89b4fa;
            z-index: 1;
        }
        .bar-label { margin-top: 8px; font-size: 12px; color: #a6adc8; }
        .bar-index { font-size: 11px; color: #bac2de; font-weight: bold;}
        
        /* Pointers indicator layer */
        .pointer {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 10;
            white-space: nowrap;
        }
        .pointer-i { background: #f38ba8; color: #11111b; top: -30px; }
        
        /* State text panel */
        .panel {
            background: #11111b;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .stack-box {
            display: flex;
            gap: 6px;
            background: #313244;
            padding: 8px;
            border-radius: 4px;
            min-height: 24px;
            align-items: center;
        }
        .stack-item {
            background: #f9e2af;
            color: #11111b;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .highlight-line { color: #a6e3a1; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trapping Rain Water: Monotonic Stack Trace</h2>
    <div class="controls">
        <button id="prevBtn" onclick="prevStep()">← Previous Step</button>
        <button id="nextBtn" onclick="nextStep()">Next Step →</button>
        <span id="stepCounter" style="align-self: center; margin-left: auto;">Step: 0 / 0</span>
    </div>

    <div class="layout">
        <div class="chart-container">
            <div class="chart" id="chart">
                </div>
        </div>
        
        <div class="panel">
            <div><strong>Variables:</strong></div>
            <div>Total Water (res): <span id="varRes" style="color: #a6e3a1; font-size: 16px; font-weight: bold;">0</span></div>
            <div>Current Index (i): <span id="varI" style="color: #f38ba8;">-</span></div>
            <div>
                <div>Stack Contents (Indices):</div>
                <div class="stack-box" id="stackView">Empty</div>
            </div>
            <hr style="border-color: #313244; width: 100%;">
            <div><strong>Log Trace:</strong></div>
            <div id="logText" style="color: #cdd6f4; white-space: pre-line; line-height: 1.4;">Click Next Step to begin initialization.</div>
        </div>
    </div>
</div>

<script>
    const height = [2, 0, 3, 1, 0, 1, 3, 2, 1];
    const maxHeight = Math.max(...height);
    const SCALE = 40; // Pixels per unit of height

    // Generate execution states statically to allow perfect time-travel scrubbing
    let states = [];
    let currentStepIdx = 0;

    function precomputeStates() {
        let stack = [];
        let res = 0;
        
        // Initial state
        states.push({
            i: null,
            stack: [],
            res: 0,
            log: "Initialization:\nstack = []\nres = 0",
            highlights: {},
            waterRects: [] // persistent water blocks trapped so far
        });

        let currentWaterBlocks = [];

        for (let i = 0; i < height.length; i++) {
            states.push({
                i: i,
                stack: [...stack],
                res: res,
                log: `Loop iteration i = ${i} (height = ${height[i]}).\nChecking stack criteria...`,
                highlights: { i: true },
                waterRects: [...currentWaterBlocks]
            });

            while (stack.length > 0 && height[i] >= height[stack[stack.length - 1]]) {
                let popIdx = stack.pop();
                let mid = height[popIdx];
                
                let logMsg = `Found right wall boundary! Pop index ${popIdx} (mid height = ${mid}) from stack.`;
                
                if (stack.length > 0) {
                    let leftIdx = stack[stack.length - 1];
                    let right = height[i];
                    let left = height[leftIdx];
                    let h = Math.min(right, left) - mid;
                    let w = i - leftIdx - 1;
                    res += h * w;

                    if (h * w > 0) {
                        currentWaterBlocks.push({ leftIdx, rightIdx: i, bottom: mid, h: h });
                    }

                    logMsg += `\n-> Left wall constraint at stack[-1] = index ${leftIdx} (height = ${left}).\n-> Dimension calculations: width = ${w}, net height = ${h}.\n-> Trapped bounded water bounded block = ${h} * ${w} = ${h*w} units.`;
                } else {
                    logMsg += `\n-> No left element remains in the stack context. Cannot form a bounded structural basin to hold water.`;
                }

                states.push({
                    i: i,
                    stack: [...stack],
                    res: res,
                    log: logMsg,
                    highlights: { i: true, mid: popIdx, left: stack[stack.length - 1] },
                    waterRects: [...currentWaterBlocks]
                });
            }
            stack.push(i);
            states.push({
                i: i,
                stack: [...stack],
                res: res,
                log: `Pushed current index ${i} onto the monotonic tracking stack structure.`,
                highlights: { i: true },
                waterRects: [...currentWaterBlocks]
            });
        }
        
        states.push({
            i: null,
            stack: [...stack],
            res: res,
            log: `Loop concluded successfully.\nFinal Calculated Trapped Rain Water Capacity = ${res}.`,
            highlights: {},
            waterRects: [...currentWaterBlocks]
        });
    }

    function renderState(idx) {
        const state = states[idx];
        
        // Update variables panel Text
        document.getElementById("varRes").innerText = state.res;
        document.getElementById("varI").innerText = state.i !== null ? state.i : "None";
        document.getElementById("logText").innerText = state.log;
        document.getElementById("stepCounter").innerText = `Step: ${idx} / ${states.length - 1}`;

        // Handle buttons state
        document.getElementById("prevBtn").disabled = idx === 0;
        document.getElementById("nextBtn").disabled = idx === states.length - 1;

        // Render Stack View Elements
        const stackView = document.getElementById("stackView");
        if (state.stack.length === 0) {
            stackView.innerHTML = '<span style="color: #7f849c;">Empty</span>';
        } else {
            stackView.innerHTML = state.stack.map(item => `<span class="stack-item">${item}</span>`).join("");
        }

        // Render Bar Graph Elements and Pointer Overlays
        const chart = document.getElementById("chart");
        chart.innerHTML = "";

        height.forEach((h, index) => {
            const wrapper = document.createElement("div");
            wrapper.className = "bar-wrapper";

            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.height = `${h * SCALE}px`;

            // Dynamic algorithmic color tracking states
            if (index === state.i) {
                bar.style.backgroundColor = "#f38ba8"; // current pointer element right wall lookup context
            } else if (index === state.highlights.mid) {
                bar.style.backgroundColor = "#f9e2af"; // popped tracking element bottom index
            } else if (index === state.highlights.left) {
                bar.style.backgroundColor = "#a6e3a1"; // left anchor element boundary
            } else if (state.stack.includes(index)) {
                bar.style.backgroundColor = "#eba0ac"; // element tracked natively inside the stack frame context
            }

            wrapper.appendChild(bar);

            // Add Text elements labels
            const valLabel = document.createElement("div");
            valLabel.className = "bar-label";
            valLabel.innerText = h;
            wrapper.appendChild(valLabel);

            const idxLabel = document.createElement("div");
            idxLabel.className = "bar-index";
            idxLabel.innerText = `[${index}]`;
            wrapper.appendChild(idxLabel);

            // Pointer elements overlay mapping labels
            if (index === state.i) {
                const ptr = document.createElement("div");
                ptr.className = "pointer pointer-i";
                ptr.innerText = "i (Right)";
                wrapper.appendChild(ptr);
            }

            chart.appendChild(wrapper);
        });

        // Overlay horizontal blocks of water bounded calculations
        state.waterRects.forEach(rect => {
            const leftBar = chart.children[rect.leftIdx];
            const rightBar = chart.children[rect.rightIdx];
            
            const leftPos = leftBar.offsetLeft + leftBar.offsetWidth;
            const rightPos = rightBar.offsetLeft;
            const width = rightPos - leftPos;

            const waterDiv = document.createElement("div");
            waterDiv.className = "water-layer";
            waterDiv.style.left = `${leftPos}px`;
            waterDiv.style.width = `${width}px`;
            waterDiv.style.bottom = `${(rect.bottom * SCALE) + 32}px`; // baseline conversion factors offset matching graph layout
            waterDiv.style.height = `${rect.h * SCALE}px`;

            chart.appendChild(waterDiv);
        });
    }

    function nextStep() {
        if (currentStepIdx < states.length - 1) {
            currentStepIdx++;
            renderState(currentStepIdx);
        }
    }

    function prevStep() {
        if (currentStepIdx > 0) {
            currentStepIdx--;
            renderState(currentStepIdx);
        }
    }

    // Initialize execution engine environment
    precomputeStates();
    renderState(0);
</script>

</body>
</html>
